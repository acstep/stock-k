<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STOCK-K · K 線看板</title>
<script>
  /* 在第一次繪製前套用記住的主題，避免深色使用者看到白閃 */
  try {
    var saved = localStorage.getItem('stock-k-theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="bar">
    <div class="brand">STOCK<span>-K</span></div>
    <div class="meta">
      <span id="updated">載入中…</span>
      <span id="warnings" class="warn"></span>
    </div>
    <div class="group" id="themes"><span class="label">主題</span></div>
  </div>
  <div class="bar">
    <div class="group" id="sorts"><span class="label">排序</span></div>
    <div class="group" id="maControls"><span class="label">均線</span></div>
  </div>
</header>

<section class="gex" id="gex" hidden>
  <div class="gex-bar">
    <div class="gex-title">
      SPX 選擇權 Gamma 曝險
      <span class="gex-sub" id="gexSub"></span>
    </div>
    <div class="group" id="gexScenarios"><span class="label">造市商持倉情境</span></div>
  </div>

  <div class="gex-stats" id="gexStats"></div>

  <div class="gex-section">
    <div class="gex-section-head">外站參考（各站算法不同，看的是彼此的差距，不是哪個才對）</div>
    <div class="gex-peer-wrap"><table class="gex-peer" id="gexPeerTable"></table></div>
  </div>

  <div class="gex-rangebar">
    <span>履約價範圍</span>
    <input type="number" id="gexFrom" step="5" inputmode="numeric">
    <span class="dash">～</span>
    <input type="number" id="gexTo" step="5" inputmode="numeric">
    <button id="gexRangeReset">重設</button>
    <span class="gex-rangeinfo" id="gexRangeInfo"></span>
  </div>

  <div class="gex-grid">
    <figure class="gex-pane">
      <figcaption>各履約價 GEX · <span id="gexCap30d">30天內到期</span></figcaption>
      <div class="chart" id="gexStrikes30d"></div>
    </figure>
    <figure class="gex-pane">
      <figcaption>各履約價 GEX · <span id="gexCapAll">全部到期日</span></figcaption>
      <div class="chart" id="gexStrikesAll"></div>
    </figure>
  </div>

  <figure class="gex-pane gex-wide">
    <figcaption>
      淨 GEX 隨假設價格變化（與 0 的交點 = Gamma Flip）
      <span class="seg" id="gexBucket">
        <button data-bucket="30d" class="on">30天內</button>
        <button data-bucket="all">全部到期日</button>
      </span>
    </figcaption>
    <div class="chart" id="gexCurve"></div>
  </figure>

  <p class="gex-note" id="gexNote"></p>
</section>

<main id="list"></main>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="app.js"></script>
<script src="gex.js"></script>
</body>
</html>
