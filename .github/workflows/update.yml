name: Update K-line data

on:
  schedule:
    # 台灣時間 06:30（美股收盤後約 1.5 小時）
    - cron: '30 22 * * *'
  workflow_dispatch:
  push:
    # 改完 watchlist.txt 存檔就自動重抓。這個 workflow 只 commit docs/data，
    # 不會再碰到 watchlist.txt，所以不會遞迴觸發。
    paths:
      - watchlist.txt

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch K-line data
        run: python scripts/fetch_kline.py

      - name: Fetch SPX gamma exposure
        run: python scripts/gex_calc.py

      - name: Fetch third-party gamma levels
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
        run: python scripts/gex_peers.py

      - name: Mirror the open gamma dataset and run the backtest
        run: python scripts/gex_backtest.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "資料無變化，略過 commit"
          else
            git commit -m "data: 更新 K 線資料 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            git push
          fi
